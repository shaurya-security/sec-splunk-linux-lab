title: Linux SSH Password Spray From One Source
id: 0e36cb3c-2732-43f5-99f5-559f53a33010
status: experimental
description: Detects failed SSH authentications against more than ten distinct accounts from one source against one Linux endpoint within ten minutes.
author: sec-splunk-linux-lab
date: '2026-10-09'
modified: '2026-10-11'
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - a62d46db-96cc-427d-a64d-55fd280bf2c1
    group-by:
        - addr
        # Logical endpoint field; mapped to the Splunk event host by the pipeline.
        - Computer
    timespan: 10m
    condition:
        gt: 10
        field: acct
falsepositives:
    - Authorized vulnerability scanning or credential-audit tools
level: high
