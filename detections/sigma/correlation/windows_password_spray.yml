title: Windows Password Spray From One Source
id: 73b89a66-7b9e-4aef-9718-616806f2da32
status: experimental
description: Failed Windows logons against more than ten distinct accounts from one source against one endpoint within ten minutes.
author: sec-splunk-linux-lab
date: '2026-10-09'
references:
  - https://attack.mitre.org/techniques/T1110/003/
correlation:
  type: value_count
  rules:
    - 5e477b99-8234-4c1e-a2bc-c48f1342b5c5
  group-by:
    - IpAddress
    - ComputerName
  timespan: 10m
  condition:
    field: TargetUserName
    gt: 10
falsepositives:
  - Authorized vulnerability scanners or penetration tests
level: high
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
