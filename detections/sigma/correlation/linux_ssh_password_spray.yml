title: Linux SSH Password Spray From One Source
id: 0e36cb3c-2732-43f5-99f5-559f53a33010
status: experimental
description: Failed SSH authentications against more than ten distinct accounts from one source against one Linux endpoint within ten minutes.
author: sec-splunk-linux-lab
date: '2026-10-09'
references:
  - https://attack.mitre.org/techniques/T1110/003/
correlation:
  type: value_count
  rules:
    - a62d46db-96cc-427d-a64d-55fd280bf2c1
  group-by:
    - SourceIp
    - ComputerName
  timespan: 10m
  condition:
    field: User
    gt: 10
falsepositives:
  - Authorized vulnerability scanners or penetration tests
level: high
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.003
