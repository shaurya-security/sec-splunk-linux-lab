title: Linux SSH Authentication Failure
id: a62d46db-96cc-427d-a64d-55fd280bf2c1
status: experimental
description: Detects failed SSH authentication records written by auditd, meaning USER_AUTH or USER_LOGIN records from sshd with a failed result.
author: sec-splunk-linux-lab
date: '2026-10-09'
modified: '2026-10-11'
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: auditd
detection:
    selection_record:
        type:
            - USER_AUTH
            - USER_LOGIN
    selection_daemon:
        exe|endswith: '/sshd'
    # auditd writes "res=failed'" (the closing quote of msg='...'), so depending on the
    # extractor the value can include a trailing quote. Match the prefix, not equality.
    selection_result:
        res|startswith: 'failed'
    condition: all of selection_*
fields:
    - acct
    - addr
    - exe
    - hostname
    - terminal
falsepositives:
    - Users mistyping passwords or using stale SSH keys
level: low
